<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepShield</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Russo+One&family=Montserrat:wght@800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="relative text-white min-h-screen flex flex-col abstract-shapes">
    <div class="background-overlay"></div>
    <div class="border-container absolute top-[7.5%] left-[7.5%] w-[85%] h-[85%] border border-gray-400 opacity-50 rounded-lg pointer-events-none"></div>

    <div class="absolute top-4 left-0 w-full p-4 flex justify-between items-center">
        <div class="logo">DeepShield</div>
        <div class="nav-links flex space-x-8 text-lg">
            <a class="transition duration-300" href="home.html">Home</a>
            <a class="text-white transition duration-300 hover:text-white hover:text-glow" href="#">Detect</a>
        </div>
    </div>
    <div class="tagline">
        Protecting<br>Reality
        <div class="sub-tagline">AI-Driven Detection for a Trustworthy World</div>
    </div>

    <style>
        main {
            position: absolute;
            right: 5%; 
            top: 50%;
            transform: translateY(-50%);
        }
    </style>
</head>
<body class="bg-[#0d1b2a] flex items-center justify-center min-h-screen">
    
    <main class="flex flex-col items-end space-y-4">
        <form id="uploadForm" class="flex flex-col items-end space-y-4">
            <input type="file" id="videoFile" class="hidden" accept="video/*">
            <button type="button" id="uploadBtn" 
        class="upload-btn bg-[#4b0082] text-white rounded-full px-6 py-2 flex items-center space-x-2 shadow-lg border-2 border-purple-500 self-start ml-[-80px]">
    <i class="fas fa-upload fa-lg"></i>
    <span>Upload Video</span>
</button>
    <button type="submit" class="upload-btn bg-[#4b0082] text-white rounded-full px-6 py-2 flex items-center space-x-2 shadow-lg border-2 border-purple-500 self-start ml-[-80px]">
        <span>Analyze</span>
    </button>
</form>
        <p id="result" class="text-lg text-white"></p>
    </main>
    <script src="script.js"></script>
</body>
</html>
